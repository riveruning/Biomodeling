<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="workbench-token" content="__WORKBENCH_TOKEN__"><title>BioModel · Agent 研究项目</title><link rel="stylesheet" href="/style.css"><script src="/projects.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/projects"><span class="brand-mark">B</span><span>BioModel<small>Agent 研究项目</small></span></a><button id="new-project" class="primary full">＋ 提出应用场景</button><a class="muted" href="/">资料导入与原生任务 →</a><div class="sidebar-heading">研究项目 <button id="refresh-projects" class="icon-button" aria-label="刷新">↻</button></div><nav id="project-list"></nav><div class="sidebar-bottom" id="provider-label"></div></aside>
<main><header class="topbar"><span>应用场景 / 研究与迭代</span><span class="tag quiet">科研原型 · 科学支持待验证</span></header><div id="notice" role="alert" hidden></div>
<section id="project-welcome" class="welcome"><div class="eyebrow">由 Agent 推进研究细节</div><h1>先描述场景，再讨论怎样建模。</h1><p class="lead">Agent 提出研究对象、粒度、文献与证据需求、建模假设和验证方案。需要对齐时暂停；每轮实验保留自己的版本。</p><button id="start-project" class="primary">提出应用场景 →</button></section>
<section id="project-view" hidden><div class="task-heading"><h1 id="project-scenario"></h1><span id="project-state" class="tag"></span></div><div id="project-metrics" class="metrics"></div><div class="toolbar"><button id="advance-project" class="primary">让 Agent 推进研究</button><button id="project-report">查看研究报告</button><button id="project-export">冻结并导出研究包</button></div><div id="project-status-note" class="next-action"></div>
<div class="workspace-grid"><div class="main-column"><section class="panel"><h2>研究方案与建模粒度</h2><div id="research-frame"></div></section><section class="panel"><h2>需要与你讨论</h2><div id="alignment"></div></section><section class="panel"><h2>模型版本与实验</h2><div id="research-iterations"></div></section><section class="panel"><h2>验证与研究解释</h2><div id="research-assessments"></div></section></div><aside class="detail-column"><section class="panel"><h2>证据与假设</h2><div id="research-evidence"></div></section><section class="panel"><h2>调用用量</h2><div id="research-usage"></div></section></aside></div></section>
<section class="panel"><h2>操作记录</h2><div id="project-jobs"></div></section><footer>Agent 的解释、假设采纳和数值成功均不构成独立生物学审核。</footer></main>
<dialog id="project-editor"><form id="project-form"><h2 id="project-editor-title">提出应用场景</h2><div id="project-editor-body"></div><div class="dialog-actions"><button type="button" id="cancel-project-editor">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="project-reader"><h2 id="project-reader-title"></h2><div id="project-reader-body"></div><div class="dialog-actions"><button id="close-project-reader">关闭</button></div></dialog>
</body></html>
