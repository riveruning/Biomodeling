[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "biomodel-agent"
version = "0.1.0"
description = "Auditable ODE modeling, simulation and bounded hypothesis research workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "scipy",
  "python-libsbml",
  "libroadrunner",
  "pypdf",
  "httpx",
  "python-dotenv>=1,<2",
]

[project.scripts]
biomodel-agent = "biomodel_agent.cli:main"

[project.urls]
Repository = "https://github.com/riveruning/Biomodeling"
Issues = "https://github.com/riveruning/Biomodeling/issues"

[project.optional-dependencies]
test = ["pytest"]
pdf = ["pymupdf==1.28.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
