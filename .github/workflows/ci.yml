name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: biomodel-agent doctor
      - run: biomodel-agent demo
      - run: python -m pytest -q
      - run: python scripts/package_starter.py
