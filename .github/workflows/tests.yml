name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-pdf.lock
      - name: Install locked test environment
        run: |
          python -m pip install -r requirements-pdf.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check development supervisor offline
        run: |
          node scripts/tests/dsh-supervisor.test.mjs
          node scripts/tests/dsh-runtime.test.mjs
      - name: Run offline regression
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-python312
          path: test-results.xml
          if-no-files-found: ignore
