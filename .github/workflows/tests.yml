name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-pdf.lock
      - name: Install locked test environment
        run: |
          python -m pip install -r requirements-pdf.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check development supervisor offline
        run: |
          node scripts/tests/dsh-supervisor.test.mjs
          node scripts/tests/dsh-runtime.test.mjs
          node scripts/tests/projects-ui.test.mjs
      - name: Run offline regression
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-python312
          path: test-results.xml
          if-no-files-found: ignore

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked runtime and test tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Check project UI and native workflows
        run: |
          node scripts/tests/projects-ui.test.mjs
          python -m pytest -q tests/test_local_ownership.py tests/test_runtime_workspace.py tests/test_model_types.py tests/test_research_provider_integration.py tests/test_research_action_guidance.py tests/test_capabilities.py --junitxml=windows-smoke.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-python312
          path: windows-smoke.xml
          if-no-files-found: ignore
