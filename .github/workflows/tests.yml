name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BIOMODEL_TESSDATA: ${{ github.workspace }}/runs/ocr-data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-pdf.lock
      - name: Install locked test environment
        run: |
          python -m pip install -r requirements-pdf.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Prepare pinned optional OCR support
        run: python scripts/prepare_ocr_data.py --output runs/ocr-data
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check development supervisor offline
        run: |
          node scripts/tests/dsh-supervisor.test.mjs
          node scripts/tests/dsh-runtime.test.mjs
          node scripts/tests/projects-ui.test.mjs
      - name: Check real browser workflows
        env:
          BIOMODEL_BROWSER_REPORT: browser-smoke.json
        run: node scripts/tests/workbench-browser.test.mjs
      - name: Run offline regression
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-python312
          path: |
            test-results.xml
            browser-smoke.json
          if-no-files-found: ignore

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      BIOMODEL_TESSDATA: ${{ github.workspace }}/runs/ocr-data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pdf.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked runtime and test tools
        run: |
          python -m pip install -r requirements-pdf.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Check project UI and native workflows
        run: |
          node scripts/tests/projects-ui.test.mjs
          python scripts/prepare_ocr_data.py --output runs/ocr-data
          python -m pytest -q tests/test_local_ownership.py tests/test_runtime_workspace.py tests/test_model_types.py tests/test_research_provider_integration.py tests/test_research_action_guidance.py tests/test_capabilities.py tests/test_research_control.py tests/test_research_advice.py tests/test_typed_references.py tests/test_material_review.py tests/test_optimization_workbench.py tests/test_source_models.py tests/test_spatial_convergence.py --junitxml=windows-smoke.xml
      - name: Check real Windows browser workflows
        env:
          BIOMODEL_BROWSER_REPORT: browser-smoke-windows.json
        run: node scripts/tests/workbench-browser.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-python312
          path: |
            windows-smoke.xml
            browser-smoke-windows.json
          if-no-files-found: ignore

  runtime-distribution:
    needs: [pytest, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build runtime without development materials
        run: python scripts/build_runtime_distribution.py --output dist/biomodel-runtime --manifest dist/runtime-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: biomodel-runtime
          path: |
            dist/biomodel-runtime.zip
            dist/runtime-manifest.json
